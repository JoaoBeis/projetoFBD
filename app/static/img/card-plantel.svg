<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" fill="none">
  <rect x="6" y="6" width="128" height="128" fill="#0c1829" stroke="#263852" stroke-width="2"/>
  <!-- Half Handball Court -->
  <rect x="20" y="18" width="100" height="104" fill="#132540" stroke="#38bdf8" stroke-width="2"/>
  <!-- Goal -->
  <rect x="56" y="12" width="28" height="6" fill="#ef4444" stroke="#f8fafc" stroke-width="1"/>
  <!-- 6m Area -->
  <path d="M40 18 C40 48, 100 48, 100 18" stroke="#f8fafc" stroke-width="2" fill="#1d4ed8" fill-opacity="0.35"/>
  <!-- 9m Free-throw Dashed Line -->
  <path d="M26 18 C26 68, 114 68, 114 18" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 7 Player Tactical Markers (Crisp Squares/Circles) -->
  <!-- GR -->
  <rect x="65" y="22" width="10" height="10" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
  <!-- PE & PD -->
  <rect x="26" y="42" width="10" height="10" fill="#2563eb" stroke="#f8fafc" stroke-width="1.5"/>
  <rect x="104" y="42" width="10" height="10" fill="#2563eb" stroke="#f8fafc" stroke-width="1.5"/>
  <!-- PIVÔ -->
  <rect x="65" y="50" width="10" height="10" fill="#2563eb" stroke="#f8fafc" stroke-width="1.5"/>
  <!-- LE, CE, LD -->
  <rect x="36" y="84" width="10" height="10" fill="#2563eb" stroke="#f8fafc" stroke-width="1.5"/>
  <rect x="65" y="92" width="10" height="10" fill="#2563eb" stroke="#f8fafc" stroke-width="1.5"/>
  <rect x="94" y="84" width="10" height="10" fill="#2563eb" stroke="#f8fafc" stroke-width="1.5"/>
</svg>
